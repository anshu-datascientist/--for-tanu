<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanu, this is for you 💖</title>
<meta name="description" content="Tanu, Ansh has something special to ask you...">
<meta property="og:title" content="Tanu, this is for you 💖">
<meta property="og:description" content="Ansh has something special to ask you... open when you're ready.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ff4d8d">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Poppins',system-ui,sans-serif;color:#fff;
    background:linear-gradient(135deg,#2b0a3d,#7b1e5a 45%,#ff4d8d);
    background-size:200% 200%;animation:bg 12s ease infinite;
  }
  @keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  #hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .fh{position:absolute;bottom:-40px;opacity:.7;animation:rise linear forwards}
  @keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:24px;z-index:1}
  .screen.active{display:flex;animation:fade .8s ease}
  @keyframes fade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

  .card{
    width:min(92vw,440px);padding:44px 28px 36px;border-radius:28px;
    background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.35);box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 0 30px rgba(255,255,255,.08);
  }
  .script{font-family:'Great Vibes',cursive;font-weight:400}
  .welcome{font-size:1.3rem;letter-spacing:4px;text-transform:uppercase;font-weight:300;opacity:.9}
  .name{font-size:5rem;line-height:1.1;margin:6px 0 10px;
    background:linear-gradient(90deg,#fff,#ffd1e3,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(255,255,255,.3)}
  .big-heart{font-size:3rem;animation:beat 1.2s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
  .sub{font-weight:300;opacity:.9;margin-top:6px}

  .btn{
    font-family:inherit;font-size:1.05rem;font-weight:600;color:#fff;cursor:pointer;
    padding:14px 30px;border:none;border-radius:999px;
    background:linear-gradient(135deg,#ff5e9c,#ff2d6f);
    box-shadow:0 8px 25px rgba(255,45,111,.55);transition:transform .2s,box-shadow .2s;
  }
  .btn:hover{transform:translateY(-3px) scale(1.04)}
  .btn:active{transform:scale(.97)}
  .btn.alt{background:linear-gradient(135deg,#ffd166,#ff8a3d);box-shadow:0 8px 25px rgba(255,138,61,.55);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  /* animated cursor leading to the button */
  .cursor-wrap{position:relative;display:inline-block;margin-top:30px}
  .cursor{position:absolute;left:50%;top:50%;width:34px;height:34px;pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));animation:glide 2.8s ease-in-out infinite}
  @keyframes glide{
    0%{transform:translate(90px,90px) scale(1);opacity:0}
    15%{opacity:1}
    55%{transform:translate(10px,6px) scale(1)}
    65%{transform:translate(10px,6px) scale(.8)}
    75%{transform:translate(10px,6px) scale(1)}
    100%{transform:translate(10px,6px) scale(1);opacity:1}
  }
  .hint{margin-top:16px;font-size:.85rem;opacity:.75}

  h1.q{font-size:1.9rem;font-weight:600;line-height:1.35;margin-bottom:28px}
  .opts{display:flex;flex-direction:column;gap:16px;align-items:center}

  .calm{font-size:2.4rem;font-weight:300;margin-top:20px}
  .breath{font-size:6rem;animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.85)}50%{transform:scale(1.2)}}
  .count{font-size:11rem;font-weight:700;line-height:1;animation:pop 1s ease forwards;
    text-shadow:0 0 40px rgba(255,255,255,.6)}
  @keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:.9}}

  .q2{font-size:1.2rem;font-weight:300;opacity:.95}
  .q2b{font-size:2.3rem;font-weight:700;margin:12px 0 30px;line-height:1.25}

  .yes-big{font-size:2.6rem;font-weight:700;line-height:1.2;animation:pop 1s ease both;
    text-shadow:0 0 30px rgba(255,255,255,.5)}
  .forever{font-size:3.4rem;margin-top:16px;line-height:1.2}
  .ring{font-size:4rem;animation:beat 1.2s infinite}
</style>
</head>
<body>
<div id="hearts"></div>
<canvas id="fx"></canvas>

<!-- PAGE 1: Welcome -->
<section class="screen active" id="p1">
  <div class="card">
    <div class="welcome">Welcome</div>
    <div class="name script">Tanu</div>
    <div class="big-heart">💖</div>
    <p class="sub">This little page was made just for you</p>
    <div class="cursor-wrap">
      <button class="btn" onclick="go('p2')">Tap to continue ✨</button>
      <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
  </div>
</section>

<!-- PAGE 2: Ready? -->
<section class="screen" id="p2">
  <div class="card">
    <h1 class="q">Are you ready to listen to something special? 🥰</h1>
    <div class="opts">
      <button class="btn" onclick="startCalm()">Yes</button>
      <button class="btn alt" onclick="startCalm()">YESSSSSSSSSS 🤩</button>
    </div>
  </div>
</section>

<!-- PAGE 3: Calm + countdown -->
<section class="screen" id="p3">
  <div id="calmBox">
    <div class="breath">💓</div>
    <div class="calm script" style="font-size:3.2rem">Keep your heart calm...</div>
    <p class="sub">Breathe in... breathe out...</p>
  </div>
  <div id="countBox" style="display:none"><div class="count" id="num">3</div></div>
</section>

<!-- PAGE 4: The Question -->
<section class="screen" id="p4">
  <div class="card">
    <div class="q2"><span class="script" style="font-size:2.2rem">Tanu,</span> Ansh wants to know...</div>
    <div class="q2b">Will you be mine forever? 💍</div>
    <div class="opts">
      <button class="btn alt" onclick="yes()">ommmmmmmggg Yess 😭💖</button>
    </div>
  </div>
</section>

<!-- PAGE 5: Celebration -->
<section class="screen" id="p5">
  <div class="ring">💍</div>
  <div class="yes-big">SHE SAID YES! 🎉</div>
  <div class="forever script">Ansh &amp; Tanu</div>
  <div class="yes-big" style="font-size:2rem;margin-top:6px">forever 💞</div>
</section>

<script>
  // ---------- navigation ----------
  function go(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function startCalm(){
    go('p3');
    setTimeout(()=>{
      document.getElementById('calmBox').style.display='none';
      document.getElementById('countBox').style.display='block';
      let n=3; const el=document.getElementById('num');
      const tick=()=>{
        el.textContent=n; el.style.animation='none'; void el.offsetWidth; el.style.animation='';
        if(n===0){go('p4');return}
        n--; setTimeout(tick,1000);
      };
      // show 3,2,1 then question
      el.textContent=3;
      let c=3;
      const run=()=>{
        el.textContent=c; el.style.animation='none'; void el.offsetWidth; el.style.animation='';
        c--;
        if(c<0){ setTimeout(()=>go('p4'),800); return; }
        setTimeout(run,1000);
      };
      run();
    },4500);
  }
  function yes(){
    go('p5');
    celebrate();
  }

  // ---------- floating hearts ----------
  const hb=document.getElementById('hearts');
  const sym=['💖','💗','💕','❤️','✨','💞'];
  setInterval(()=>{
    const h=document.createElement('div');
    h.className='fh';
    h.textContent=sym[Math.floor(Math.random()*sym.length)];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(14+Math.random()*26)+'px';
    h.style.animationDuration=(6+Math.random()*6)+'s';
    hb.appendChild(h);
    setTimeout(()=>h.remove(),12500);
  },450);

  // ---------- confetti + fireworks ----------
  const cv=document.getElementById('fx'),cx=cv.getContext('2d');
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  size();addEventListener('resize',size);
  let parts=[],running=false;
  const colors=['#ff2d6f','#ffd166','#fff','#ff8a3d','#9b5de5','#00f5d4','#f15bb5'];
  function burst(x,y,n=90){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=2+Math.random()*7;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.08,life:90+Math.random()*40,
        c:colors[Math.floor(Math.random()*colors.length)],r:2+Math.random()*3,heart:Math.random()<.25});
    }
  }
  function rain(n=6){
    for(let i=0;i<n;i++){
      parts.push({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.02,
        life:300,c:colors[Math.floor(Math.random()*colors.length)],r:4+Math.random()*4,heart:Math.random()<.4});
    }
  }
  function draw(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;
      cx.globalAlpha=Math.max(0,Math.min(1,p.life/40));
      cx.fillStyle=p.c;
      if(p.heart){cx.font=(p.r*4)+'px serif';cx.fillText('❤',p.x,p.y)}
      else{cx.fillRect(p.x,p.y,p.r,p.r*1.6)}
    });
    cx.globalAlpha=1;
    parts=parts.filter(p=>p.life>0&&p.y<cv.height+30);
    if(running||parts.length) requestAnimationFrame(draw);
  }
  function celebrate(){
    running=true;draw();
    let t=0;
    const iv=setInterval(()=>{
      burst(Math.random()*cv.width,Math.random()*cv.height*.6);
      rain(8);
      if(++t>60){clearInterval(iv);running=false}
    },350);
    burst(cv.width/2,cv.height/2,200);
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }
</script>
</body>
</html>
